name: Build ULR binaries
on:
  workflow_dispatch:
  push:
    branches: [main, feature/universal-resolver-ci]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s tests -v
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS
          - os: ubuntu-latest
            label: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: python -m pip install -r requirements-build.txt
      - name: Install browser
        run: python -m playwright install chromium
      - name: Build
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name ULR --collect-all playwright launcher.py
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ULR-${{ matrix.label }}
          path: dist/
          if-no-files-found: error
